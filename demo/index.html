<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5e3c">
<title>森林动物花园</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=garden09">
</head>
<body>
<div id="app">

  <section class="screen on" id="intro">
    <div class="blob"></div>
    <h1>我们不看你会不会赚钱<br>看你怎么做决定</h1>
    <p>三关都是真实发生过的行情，走的是同一条时间线。</p>
    <p class="dim">你的每一个行为，都会结出一颗果实。</p>
    <button class="btn" id="startBtn" style="margin-top:22px">开始</button>
    <div id="pick" class="pick">
      <p class="dim pkhead">先凭直觉选一只 —— 你觉得你是哪一种？</p>
      <div class="beasts" id="beastPick"></div>
      <p class="dim pkfoot">这一选只是对照，不参与任何判定</p>
    </div>
    <p class="dim" style="margin-top:26px;font-size:11px">森林动物 · 三次决定，发现你的交易习惯</p>
  </section>

  <section class="screen" id="stage">
    <div class="hud">
      <div class="hud-l"><b id="stageName">—</b> <span id="stageDate"></span></div>
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="hud-r"><span id="formName">潜力态 · 幼兽</span></div>
    </div>
    <div id="journeyGoal" role="status">初次相遇 · 三次决定，种下第一畦地</div>
    <div id="chartWrap">
      <canvas id="chart"></canvas>
      <div id="captions"></div>
    </div>
    <div id="field" data-season="spring">
      <div class="skyline"></div>
      <div id="sceneLabel">森林观察站</div>
      <div id="previewTag">每个决定，都有回声</div>
      <div id="sceneGuide" aria-label="本关进度"><span class="step on">观察</span><span class="sep">›</span><span class="step">决定</span><span class="sep">›</span><span class="step">生长</span></div>
      <div id="sceneToast" role="status" aria-live="polite"></div>
      <button id="petBtn" type="button">和动物打招呼</button>
      <div id="fieldHint">做一个决定，地里就长出一株</div>
      <div class="beast" id="beast">
        <img id="beastArt" class="beast-art" alt="">
        <svg viewBox="0 0 44 40" width="44" height="40" fill="currentColor">
          <path id="beastBody" d="M7 34 Q3 23 13 20 Q22 17 29 22 Q35 27 33 34 Z"/>
          <circle cx="33" cy="17" r="7.2"/>
          <path d="M28 11 L26 5 L32 9 Z"/>
          <path d="M37 11 L39 5 L41 10 Z"/>
          <path d="M8 24 Q1 20 3 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="feedTag"></div>
    </div>
    <div id="revealNum"><div class="v"></div><div class="k"></div></div>
    <div id="console">
      <div class="timerbar"><i id="timerFill"></i></div>
      <div class="askline" id="askline">你可以先照料一下，也可以直接决定。</div>
      <div class="carehead" id="carehead">查数据 · 先观察，再做决定</div>
      <div class="probes" id="probes"></div>
      <div class="actions" id="actions"></div>
      <div id="decisionReview" aria-live="polite" hidden></div>
    </div>
  </section>

  <section class="screen" id="result"></section>

</div>

<div id="helpMask"></div>
<div id="helpPop"></div>

<script src="data.js"></script>
<script src="progression.js?v=garden09"></script>
<script src="market-question.js?v=garden09"></script>
<script src="app.js?v=garden09"></script>
</body>
</html>
